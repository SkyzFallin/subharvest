[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "subharvest"
version = "0.1.0"
description = "Passive subdomain enumeration from public sources. Active probing optional, never default."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "SkyzFallin" }]
requires-python = ">=3.11"
keywords = ["recon", "subdomain", "enumeration", "osint", "pentest"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
]
dependencies = [
    "httpx>=0.27",
    "dnspython>=2.6",
    "typer>=0.12",
    "rich>=13.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "respx>=0.21",
]

[project.scripts]
subharvest = "subharvest.cli:app"

[project.urls]
Homepage = "https://github.com/SkyzFallin/subharvest"
Issues = "https://github.com/SkyzFallin/subharvest/issues"

[tool.setuptools.packages.find]
include = ["subharvest*"]

[tool.setuptools.package-data]
subharvest = ["data/*.txt", "config/*.toml"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
